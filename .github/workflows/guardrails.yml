name: Guardrails

# Deliberately no `paths-ignore`, unlike ci.yml: a commit that only edits CLAUDE.md or
# docs/CHECKLIST.md produces no CI run at all, and those are the two files that decide what
# every later session is allowed to do.

permissions:
  contents: read

on:
  push:
    branches:
      - dev
      - master
  pull_request:
    branches:
      - dev
      - master

concurrency:
  group: guardrails-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  guardrails:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # For pull_request, actions/checkout defaults to GitHub's synthetic test-merge commit
          # (refs/pull/<n>/merge) — an auto-generated "Merge X into Y" message that can never
          # carry a Gate-change: line, even when the real commit underneath it did (found on the
          # first tripwire-touching PR run through this flow, #15). Pinning to the PR's actual
          # head commit checks the commit message that will really land on the branch.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Work out the range to check
        id: range
        run: |
          if [ "${{ github.event_name }}" = 'pull_request' ]; then
            range="origin/${{ github.base_ref }}..HEAD"
          else
            before='${{ github.event.before }}'
            if ! git cat-file -e "${before}^{commit}" 2>/dev/null; then
              before="$(git rev-parse --verify --quiet 'HEAD^' || echo '')"
            fi
            range="${before:+${before}..}HEAD"
          fi
          echo "range=${range}" >> "$GITHUB_OUTPUT"
          echo "Checking ${range}"

      - name: Check the gate tripwires
        run: .github/scripts/check-guardrails.sh '${{ steps.range.outputs.range }}'

      - name: Validate workflow YAML syntax
        run: |
          npm install --no-save js-yaml
          for f in .github/workflows/*.yml; do
            echo "Checking ${f}"
            node -e "require('js-yaml').load(require('fs').readFileSync('${f}', 'utf8'))"
          done
